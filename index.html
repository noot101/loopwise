<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Loopwise</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root{
    --moss:#3a5a40;
    --moss-dark:#2c4530;
    --sand:#f2ede4;
    --bark:#5c4a3a;
    --clay:#c77b4a;
    --paper:#fffdf9;
    --ink:#22271f;
    --line:#d8d0c0;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; height:100%;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--sand);
    color:var(--ink);
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  #app{ display:flex; flex-direction:column; height:100%; }

  header{
    padding:14px 18px 10px;
    background:var(--paper);
    border-bottom:1px solid var(--line);
  }
  header h1{
    margin:0; font-size:1.3rem; letter-spacing:-0.01em; color:var(--moss-dark);
  }
  header p{ margin:2px 0 0; font-size:0.85rem; color:var(--bark); }

  #controls{
    display:flex; gap:14px; align-items:center; flex-wrap:wrap;
    padding:12px 18px; background:var(--paper); border-bottom:1px solid var(--line);
  }
  #distanceWrap{ display:flex; flex-direction:column; flex:1; min-width:180px; gap:2px; }
  #distanceWrap label{ font-size:0.8rem; color:var(--bark); display:flex; justify-content:space-between; }
  #distanceWrap label b{ color:var(--moss-dark); font-weight:600; }
  #distance{
    width:100%; accent-color:var(--moss); height:28px;
  }
  button{
    border:none; border-radius:6px; padding:9px 16px; font-size:0.9rem;
    cursor:pointer; font-weight:600; transition:opacity .15s; white-space:nowrap;
  }
  button:disabled{ opacity:.5; cursor:default; }
  #generate{ background:var(--moss); color:#fff; }
  #generate:hover:not(:disabled){ opacity:.9; }

  #mapWrap{ flex:1; min-height:0; position:relative; }
  #map{ position:absolute; inset:0; }

  #routeInfo{
    position:absolute; left:50%; bottom:18px; transform:translateX(-50%);
    background:var(--paper); border-radius:10px; padding:10px 20px;
    box-shadow:0 2px 10px rgba(0,0,0,.2);
    display:none; align-items:center; gap:18px; z-index:1000;
    font-size:0.9rem;
  }
  #routeInfo.open{ display:flex; }
  #routeInfo .label{ font-weight:600; color:var(--moss-dark); }
  #routeInfo .stat{ color:var(--ink); }
  #routeInfo .stat b{ color:var(--moss-dark); }

  #status{
    padding:8px 18px; font-size:0.85rem; color:var(--bark); background:var(--paper);
    min-height:1.2em;
  }
  #status.error{ color:#a4432b; }

  #keyModal{
    position:fixed; inset:0; background:rgba(34,39,31,.6);
    display:flex; align-items:center; justify-content:center; padding:20px; z-index:1000;
  }
  #keyModal.hidden{ display:none; }
  #keyBox{
    background:var(--paper); border-radius:10px; padding:20px; max-width:360px; width:100%;
  }
  #keyBox h2{ margin-top:0; font-size:1.05rem; color:var(--moss-dark); }
  #keyBox p{ font-size:0.85rem; color:var(--bark); line-height:1.4; }
  #keyBox input{
    width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:6px;
    margin:10px 0; font-size:0.9rem;
  }
  #keyBox button{ background:var(--moss); color:#fff; width:100%; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Loopwise</h1>
    <p>Een nieuw wandelrondje, elke keer vanaf waar je staat.</p>
  </header>

  <div id="controls">
    <div id="distanceWrap">
      <label for="distance">Afstand <b id="distanceValue">5.0 km</b></label>
      <input type="range" id="distance" value="5" min="1" max="20" step="0.1">
    </div>
    <button id="generate">Genereer routes</button>
  </div>

  <div id="status"></div>
  <div id="mapWrap">
    <div id="map"></div>
    <div id="routeInfo">
      <span class="label" id="routeLabel">Route</span>
      <span class="stat"><b id="statDist">–</b> km</span>
      <span class="stat">± <b id="statTime">–</b> min</span>
    </div>
  </div>
</div>

<div id="keyModal" class="hidden">
  <div id="keyBox">
    <h2>Twee gratis API-keys nodig</h2>
    <p>Loopwise gebruikt twee gratis diensten: <b>openrouteservice.org</b> voor het berekenen van routes, en <b>MapTiler</b> voor de kaarttegels. Beide keys worden alleen op je eigen telefoon opgeslagen.</p>
    <input type="text" id="apiKeyInput" placeholder="openrouteservice API-key">
    <input type="text" id="mapKeyInput" placeholder="MapTiler API-key (maptiler.com, gratis account)">
    <button id="saveKey">Opslaan</button>
  </div>
</div>

<script>
(function(){
  const ORS_URL = "https://api.openrouteservice.org/v2/directions/foot-walking/geojson";
  const COLORS = ["#1d4ed8", "#e11d48", "#059669"];
  const MAX_ATTEMPTS_PER_ROUTE = 5;

  let map, userMarker, routeLayers = [], selectedIndex = null, currentRoutes = [];
  let userLatLng = null;
  let apiKey = localStorage.getItem("loopwise_ors_key") || "";
  let mapKey = localStorage.getItem("loopwise_map_key") || "";

  const statusEl = document.getElementById("status");
  const genBtn = document.getElementById("generate");
  const distanceInput = document.getElementById("distance");
  const distanceValue = document.getElementById("distanceValue");
  const keyModal = document.getElementById("keyModal");

  function setStatus(msg, isError){
    statusEl.textContent = msg || "";
    statusEl.classList.toggle("error", !!isError);
  }

  // Hoe streng we op de afstand mikken: kleiner rondje mag relatief meer afwijken,
  // een groot rondje moet dichterbij de opgegeven afstand blijven.
  function toleranceFor(km){
    if(km < 5) return 0.20;
    if(km > 15) return 0.05;
    return 0.10;
  }

  distanceInput.addEventListener("input", () => {
    distanceValue.textContent = parseFloat(distanceInput.value).toFixed(1) + " km";
  });

  function initMap(lat, lon){
    map = L.map("map").setView([lat, lon], 14);
    L.tileLayer("https://api.maptiler.com/maps/streets-v2/{z}/{x}/{y}.png?key=" + mapKey, {
      maxZoom: 19,
      attribution: "&copy; OpenStreetMap-bijdragers &copy; MapTiler"
    }).addTo(map);
    userMarker = L.circleMarker([lat, lon], {
      radius: 8, color: "#c77b4a", fillColor: "#c77b4a", fillOpacity: 1
    }).addTo(map).bindPopup("Jouw startpunt");
  }

  function locate(){
    setStatus("Je locatie wordt opgehaald…");
    if(!navigator.geolocation){
      setStatus("Deze browser ondersteunt geen locatiebepaling.", true);
      return;
    }
    navigator.geolocation.getCurrentPosition(
      pos => {
        userLatLng = { lat: pos.coords.latitude, lon: pos.coords.longitude };
        initMap(userLatLng.lat, userLatLng.lon);
        setStatus("Locatie gevonden. Kies een afstand en genereer routes.");
        genBtn.disabled = false;
      },
      err => {
        setStatus("Kon je locatie niet ophalen: " + err.message + ". Sta locatietoegang toe en herlaad de pagina.", true);
      },
      { enableHighAccuracy: true, timeout: 15000 }
    );
  }

  function clearRoutes(){
    routeLayers.forEach(l => map.removeLayer(l));
    routeLayers = [];
    currentRoutes = [];
    selectedIndex = null;
    document.getElementById("routeInfo").classList.remove("open");
  }

  async function fetchRoute(targetMeters, seed){
    const body = {
      coordinates: [[userLatLng.lon, userLatLng.lat]],
      options: {
        round_trip: {
          length: targetMeters,
          points: 4,
          seed: seed
        }
      }
    };
    const resp = await fetch(ORS_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": apiKey
      },
      body: JSON.stringify(body)
    });
    if(!resp.ok){
      const text = await resp.text();
      throw new Error("ORS-fout (" + resp.status + "): " + text.slice(0,200));
    }
    return resp.json();
  }

  // Probeert (met wisselende seeds) een route te vinden die binnen de tolerantie
  // van de opgegeven afstand valt. Houdt de beste poging bij als terugvaloptie.
  async function fetchRouteWithinTolerance(targetMeters, tolerance){
    let best = null;
    for(let attempt = 0; attempt < MAX_ATTEMPTS_PER_ROUTE; attempt++){
      const seed = Math.floor(Math.random()*100000);
      let geojson;
      try{
        geojson = await fetchRoute(targetMeters, seed);
      } catch(e){
        if(attempt === MAX_ATTEMPTS_PER_ROUTE - 1 && !best) throw e;
        continue;
      }
      const feature = geojson.features[0];
      const dist = feature.properties.summary.distance;
      const deviation = Math.abs(dist - targetMeters) / targetMeters;
      if(!best || deviation < best.deviation){
        best = { feature, dist, duration: feature.properties.summary.duration, deviation };
      }
      if(deviation <= tolerance){
        return best;
      }
    }
    return best;
  }

  async function generateRoutes(){
    if(!apiKey){
      keyModal.classList.remove("hidden");
      return;
    }
    if(!userLatLng){
      setStatus("Nog geen locatie beschikbaar.", true);
      return;
    }
    genBtn.disabled = true;
    clearRoutes();
    setStatus("Routes worden berekend…");

    const km = parseFloat(distanceInput.value);
    const targetMeters = Math.round(km * 1000);
    const tolerance = toleranceFor(km);

    try{
      const results = await Promise.allSettled([
        fetchRouteWithinTolerance(targetMeters, tolerance),
        fetchRouteWithinTolerance(targetMeters, tolerance),
        fetchRouteWithinTolerance(targetMeters, tolerance)
      ]);
      let ok = 0;
      results.forEach((r, i) => {
        if(r.status === "fulfilled" && r.value){
          const { feature, dist, duration } = r.value;
          const layer = L.geoJSON(feature, {
            style: { color: COLORS[i % COLORS.length], weight: 6, opacity: 0.85 }
          }).addTo(map);
          layer.on("click", () => selectRoute(i));
          routeLayers.push(layer);
          currentRoutes.push({ distance: dist, duration: duration });
          ok++;
        }
      });
      if(ok === 0){
        setStatus("Geen routes gevonden. Probeer een andere afstand.", true);
      } else {
        setStatus(ok + " route(s) gevonden, dicht bij " + km.toFixed(1) + " km. Tik op een lijn om de details te zien.");
        const group = new L.featureGroup(routeLayers);
        map.fitBounds(group.getBounds().pad(0.1));
      }
    } catch(e){
      setStatus("Er ging iets mis: " + e.message, true);
    } finally {
      genBtn.disabled = false;
    }
  }

  function selectRoute(i){
    selectedIndex = i;
    routeLayers.forEach((l, idx) => {
      l.setStyle({ weight: idx === i ? 8 : 6, opacity: idx === i ? 1 : 0.4 });
    });
    const r = currentRoutes[i];
    document.getElementById("routeLabel").textContent = "Route " + (i+1);
    document.getElementById("statDist").textContent = (r.distance/1000).toFixed(1);
    document.getElementById("statTime").textContent = Math.round(r.duration/60);
    document.getElementById("routeInfo").classList.add("open");
  }

  genBtn.addEventListener("click", generateRoutes);

  document.getElementById("saveKey").addEventListener("click", () => {
    const orsVal = document.getElementById("apiKeyInput").value.trim();
    const mapVal = document.getElementById("mapKeyInput").value.trim();
    if(!orsVal || !mapVal){ return; }
    apiKey = orsVal;
    mapKey = mapVal;
    localStorage.setItem("loopwise_ors_key", orsVal);
    localStorage.setItem("loopwise_map_key", mapVal);
    keyModal.classList.add("hidden");
    locate();
  });

  genBtn.disabled = true;
  if(!apiKey || !mapKey){
    keyModal.classList.remove("hidden");
  } else {
    locate();
  }
})();
</script>
</body>
</html>
